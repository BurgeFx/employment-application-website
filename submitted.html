<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Application Submitted</title>
    <link rel="stylesheet" href="index.css">
    <style>
        .success-container {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        .success-card {
            width: min(100%, 980px);
            background: #fff;
            border: 1px solid #e8ebef;
            border-radius: 24px;
            box-shadow: 0 24px 70px rgba(16, 43, 78, .1);
            overflow: hidden;
        }
        .success-header {
            padding: 44px 7% 30px;
            color: #fff;
            text-align: center;
            background: var(--navy);
        }
        .success-header h1 {
            color: #fff;
            font-size: clamp(2.2rem, 5vw, 3.4rem);
            margin: 0 0 18px;
            font-family: 'Playfair Display', Georgia, serif;
            font-weight: 700;
        }
        .success-content {
            padding: 44px 7%;
            text-align: center;
        }
        .success-icon {
            font-size: 80px;
            margin-bottom: 24px;
            animation: bounce 0.6s ease-in-out;
            display: block;
        }
        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }
        .success-content p {
            color: var(--ink);
            margin: 0 0 18px;
            line-height: 1.75;
            font-size: 1rem;
        }
        .success-content p:last-of-type {
            margin-bottom: 32px;
        }
        .apply-button {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 16px 32px;
            background: var(--navy);
            color: white;
            text-decoration: none;
            border: none;
            border-radius: 9px;
            font-family: 'DM Sans', Arial, sans-serif;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.3s ease, box-shadow 0.3s ease;
        }
        .apply-button:hover {
            background: var(--navy-light);
            box-shadow: 0 8px 24px rgba(16, 43, 78, .15);
        }
        .success-footer {
            padding: 20px 7%;
            text-align: center;
            border-top: 1px solid var(--line);
            background: #f7f8fa;
        }
        .success-footer p {
            margin: 0;
            font-size: 0.88rem;
            color: var(--muted);
        }
        @media (max-width: 620px) {
            .success-header, .success-content, .success-footer {
                padding-left: 20px;
                padding-right: 20px;
            }
            .apply-button {
                width: 100%;
                justify-content: center;
            }
        }
    </style>
</head>
<body>
    <div class="success-container">
        <div class="success-card">
            <header class="success-header">
                <h1>Application Submitted!</h1>
            </header>
            <main class="success-content">
                <span class="success-icon">✅</span>
                <p>Thank you for applying to the Body Mind and Soul Personal Assistant position. Your application has been received and will be reviewed shortly.</p>
                <p>You will receive updates via email at the address you provided.</p>
                <button class="apply-button" onclick="window.location.href='/'">Return to Home <span>→</span></button>
            </main>
            <footer class="success-footer">
                <p>© 2026 Body Mind And Soul</p>
            </footer>
        </div>
    </div>
</body>
</html>
